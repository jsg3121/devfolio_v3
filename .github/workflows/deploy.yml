name: Deploy to AWS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy static assets to S3
        run: |
          aws s3 sync dist/_astro/ s3://sungyujang-devfolio/_astro/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Deploy HTML files to S3
        run: |
          aws s3 sync dist/ s3://sungyujang-devfolio/ \
            --exclude "*" \
            --include "*.html" \
            --include "**/*.html" \
            --cache-control "public, max-age=31536000"

      - name: Deploy other static files to S3
        run: |
          aws s3 sync dist/ s3://sungyujang-devfolio/ \
            --exclude "_astro/*" \
            --exclude "*.html" \
            --exclude ".DS_Store" \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EOUL8NWXIF07O \
            --paths "/*"
